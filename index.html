<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Christian is a frontend developer who builds functional, responsive and user-friendly websites.">
    <title>RianLabs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./styles/index.css">
    <script src="./scripts/index.js" defer></script>
</head>
<body>
    <header class="site-header" id="header">
        <nav class="navbar container" aria-label="Main navigation">
            <a href="#header" class="logo">RianLabs</a>

            <button 
                class="ham-menu"
                type="button"
                aria-expanded="false"
                aria-label="Open navigation menu"
                aria-controls="nav-links"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="nav-links" id="nav-links">
                <ul class="nav-ul">
                    <li><a href="#header">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero-section container" aria-labelledby="hero-title">
            <div class="hero-texts">
                <p class="hero-eyebrow">Frontend Developer</p>
                <p class="hero-title" id="hero-title">Hello, I'm Christian.</p>
                <p class="hero-description">
                    I'm a frontend developer who enjoys turning ideas and designs into 
                    functional, responsive websites. I love learning, building projects 
                    and continuously improving my skills.
                </p>

                <div class="hero-buttons">
                    <a class="button button-primary" href="#projects">Live Projects</a>
                    <a class="button button-secondary" href="#contact">Contact Me</a>
                </div>
            </div>

            <img 
                src="./assets/profile-picture.webp" 
                alt="Portrait of Christian" 
                class="profile-image"
                width="640"
                height="800"
            >
        </section>
    </main>

    <footer></footer>
</body>
</html>
